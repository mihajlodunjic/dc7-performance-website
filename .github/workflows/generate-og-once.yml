name: Generate OG image once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/generate-og-once.yml'

permissions:
  contents: write

jobs:
  generate-og:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate OG assets
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          import os

          src_path = 'public/images/dejan-hero-barbell.jpeg'
          out_dir = 'public/social'
          os.makedirs(out_dir, exist_ok=True)

          src = Image.open(src_path).convert('RGB')
          W, H = 1200, 630
          bg = (14, 14, 19)
          canvas = Image.new('RGB', (W, H), bg)

          # Crop the real Dejan photo for a wide OG composition while keeping his head,
          # torso and barbell visible on the right side.
          field_w = 760
          target_ratio = field_w / H
          crop_h = int(src.width / target_ratio)
          crop_h = min(crop_h, src.height)
          top = min(110, max(0, src.height - crop_h))
          crop = src.crop((0, top, src.width, top + crop_h))
          photo = crop.resize((field_w, H), Image.Resampling.LANCZOS)
          photo = Image.blend(photo, Image.new('RGB', photo.size, (0, 0, 0)), 0.08)
          canvas.paste(photo, (W - field_w, 0))

          # Blend the left edge of the photograph into the site's dark background.
          pix = canvas.load()
          x0, x1 = 430, 620
          for x in range(x0, x1):
              t = (x - x0) / (x1 - x0)
              a = t * t * (3 - 2 * t)  # smoothstep
              for y in range(H):
                  r, g, b = pix[x, y]
                  pix[x, y] = (
                      int(bg[0] * (1 - a) + r * a),
                      int(bg[1] * (1 - a) + g * a),
                      int(bg[2] * (1 - a) + b * a),
                  )
          for x in range(0, x0):
              for y in range(H):
                  pix[x, y] = bg

          draw = ImageDraw.Draw(canvas)
          bold = '/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          regular = '/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'

          f_dc = ImageFont.truetype(bold, 30)
          f_name = ImageFont.truetype(bold, 17)
          f_meta = ImageFont.truetype(bold, 14)
          f_h1 = ImageFont.truetype(bold, 58)
          f_sub = ImageFont.truetype(regular, 20)
          f_handle = ImageFont.truetype(bold, 14)

          white = (241, 240, 236)
          muted = (166, 167, 172)
          accent = (113, 133, 168)
          x = 78

          draw.text((x, 58), 'DC7', font=f_dc, fill=white)
          draw.text((145, 66), '/', font=f_name, fill=accent)
          draw.text((163, 67), 'DEJAN NIKOLIĆ', font=f_name, fill=muted)
          draw.text((x, 118), 'SPORTS PERFORMANCE', font=f_meta, fill=accent)
          draw.multiline_text(
              (x, 165),
              'Trening za ono\nšto se dešava\nna terenu.',
              font=f_h1,
              fill=white,
              spacing=5,
          )
          draw.rectangle((x, 357, x + 84, 361), fill=accent)
          draw.text((x, 390), 'Kondiciona priprema sportista • Beograd', font=f_sub, fill=muted)
          draw.text((x, 572), '@de.coach7', font=f_handle, fill=muted)

          canvas.save(os.path.join(out_dir, 'og-default.jpg'), 'JPEG', quality=88, optimize=True, progressive=True)
          canvas.save(os.path.join(out_dir, 'og-default.webp'), 'WEBP', quality=84, method=6)
          PY

      - name: Commit generated OG assets and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/generate-og-once.yml
          git add public/social/og-default.jpg public/social/og-default.webp .github/workflows/generate-og-once.yml
          git commit -m 'Update DC7 Open Graph social images'
          git push
